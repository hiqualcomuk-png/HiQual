<!DOCTYPE html>
<html>
<head>
<title>HiQual Verification</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 30px 20px;
    background: #ffffff;
    color: #222;
  }
  .top-logo {
    width: 140px;
    margin-bottom: 20px;
  }
  .badge {
    width: 110px;
    margin: 0 auto 22px;
    display: block;
  }
  .thanks {
    font-size: 20px;
    font-weight: 600;
    max-width: 420px;
    margin: 0 auto 15px;
  }
  .based-on {
    font-size: 15px;
    color: #333;
    margin-bottom: 20px;
  }
  .field-label {
    font-size: 15px;
    color: #222;
    margin-top: 14px;
  }
  .field-value {
    font-size: 17px;
    font-weight: 500;
    margin-top: 2px;
  }
  .statement {
    max-width: 460px;
    margin: 25px auto 0;
    font-size: 14.5px;
    line-height: 1.6;
    color: #222;
    text-align: left;
  }
  .notfound { color: #C4432E; font-size: 22px; margin-top: 20px; }
</style>
</head>
<body>

<img src="logo-min (1).png" class="top-logo" alt="HiQual Logo">

<div id="result">Checking...</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRZwBJRtmFNd0Wy_8WTbXQUMSvLlC9YA0qlGVJ4gOsLYNZBbqGrChO0gPTKxRsxHp2U8bECw6ZJCDw7/pub?gid=0&single=true&output=csv";

function getParam(name) {
  const params = new URLSearchParams(window.location.search);
  return params.get(name);
}

fetch(CSV_URL)
  .then(res => res.text())
  .then(text => {
    const id = getParam("id");
    const rows = text.split("\n").map(r => r.split(","));
    let found = null;
    for (let i = 1; i < rows.length; i++) {
      if (rows[i][0] && rows[i][0].trim() === id) {
        found = rows[i];
        break;
      }
    }
    const div = document.getElementById("result");
    if (found) {
      // Column order: ID, Name, Father Name, Date of Birth, Course, Organization, Date
      const credId = found[0];
      const name = found[1];
      const fatherName = found[2];
      const dob = found[3];
      const course = found[4];
      const org = found[5];
      const date = found[6];

      div.innerHTML =
        "<img src='images.png' class='badge' alt='Verified'>" +
        "<div class='thanks'>Thank you for using the HiQual verifications service.</div>" +
        "<div class='based-on'>Based on given information</div>" +

        "<div class='field-label'>Name:</div>" +
        "<div class='field-value'>" + name + "</div>" +

        "<div class='field-label'>Father Name:</div>" +
        "<div class='field-value'>" + fatherName + "</div>" +

        "<div class='field-label'>Date of Birth:</div>" +
        "<div class='field-value'>" + dob + "</div>" +

        "<div class='field-label'>Credential's ID:</div>" +
        "<div class='field-value'>" + credId + "</div>" +

        "<div class='field-label'>Course Name:</div>" +
        "<div class='field-value'>" + course + "</div>" +

        "<div class='field-label'>ATP:</div>" +
        "<div class='field-value'>" + org + "</div>" +

        "<div class='field-label'>Date:</div>" +
        "<div class='field-value'>" + date + "</div>" +

        "<div class='statement'>We hereby verify that the information provided above is accurate and corresponds to the certificate issued by <b>HiQual UK</b> to <b>" + name + "</b> on the specified date. " + name + " has successfully completed the \"" + course + "\" course as indicated.</div>";
    } else {
      div.innerHTML = "<h1 class='notfound'>✘ NOT FOUND</h1><p>No record matches this ID.</p>";
    }
  })
  .catch(() => {
    document.getElementById("result").innerHTML = "<p>Error loading data.</p>";
  });
</script>
</body>
</html>
